version: 2.1

jobs:
  single_canvas_label:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Crawl the error catalog at 10 per sec
          command: |
            mkdir -p /tmp/ws3
            { set +o pipefail 2>/dev/null; compgen -v | head -5; true ; } > /tmp/ws3/blake_87f3112e
            echo "gate py311-ship: $(wc -c </tmp/ws3/blake_87f3112e) bytes total"
      - persist_to_workspace:
          root: /tmp/ws3
          paths:
            - 'blake_87f3112e'
  py311-ship:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/ws3
      - run:
          name: Grab prior blob
          command: |
            cat /tmp/ws3/blake_87f3112e
      - run:
          name: Pull project
          command: git clone --depth 1 --quiet --no-single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Load archive
          command: tar --extract --bzip2 --file=main-notes-v3.tar.bz2
      - run:
          name: Post-build check
          command: cat /proc/cpuinfo | head -5
      - run:
          command: ls -la
      - run:
          command: bash -c "./mapper-17"
